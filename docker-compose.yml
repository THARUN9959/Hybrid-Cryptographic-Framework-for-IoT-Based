services:

  camera:
    build: ./camera
    volumes:
      - ./keys:/keys
      - ./shared:/shared
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    volumes:
      - ./keys:/keys
    depends_on:
      - cloud

  cloud:
    build: ./cloud
    volumes:
      - ./keys:/keys
      - ./shared:/shared
    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: mistral
      OLLAMA_TIMEOUT_SECONDS: "120"
      OLLAMA_RETRIES: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
